# folio-cms: run the whole stack with one command.
#
#   docker compose up --build
#
# Then open http://localhost:3000 (admin at /admin). The demo login is printed
# in the app logs. Every setting has a safe local default, so no .env file is
# needed. To override one, create .env next to this file (see .env.example).

name: folio-cms

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-folio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-folio}
      POSTGRES_DB: ${POSTGRES_DB:-folio}
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/,
      # so the volume mounts the parent directory.
      - db-data:/var/lib/postgresql
    ports:
      # Exposed on localhost only, for local tools and `npm run dev`.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-folio}:${POSTGRES_PASSWORD:-folio}@db:5432/${POSTGRES_DB:-folio}
      # Local-only default. Set your own for any real deployment.
      AUTH_SECRET: ${AUTH_SECRET:-local-dev-secret-change-me-in-production-0123456789}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      DEMO_MODE: ${DEMO_MODE:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  db-data:
