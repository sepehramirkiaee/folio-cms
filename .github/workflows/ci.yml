name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # postinstall runs `prisma generate`
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Unit and component tests
        run: npm test

      - name: Build
        run: npm run build

  migrations:
    name: Migrations match the schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: folio
          POSTGRES_PASSWORD: folio
          POSTGRES_DB: folio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U folio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://folio:folio@localhost:5432/folio
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Apply migrations to an empty database
        run: npx prisma migrate deploy

      # Fails if schema.prisma changed without a matching migration.
      - name: Check for drift between migrations and schema
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Seed runs on the migrated database
        run: npm run db:seed

  e2e:
    name: End-to-end and accessibility tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: folio
          POSTGRES_PASSWORD: folio
          POSTGRES_DB: folio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U folio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://folio:folio@localhost:5432/folio
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

      # Starts the production server, resets the database to the seed content,
      # then runs the user flows and the axe checks in light and dark mode.
      - name: Run Playwright
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: Docker smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The same command the README promises, from a clean state.
      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 180

      - name: Check health, public page and admin login page
        run: |
          curl --fail --silent http://localhost:3000/api/health
          curl --fail --silent --output /dev/null http://localhost:3000/
          curl --fail --silent --output /dev/null http://localhost:3000/admin/login

      - name: Check the demo login is printed in the logs
        run: |
          docker compose logs app | grep "Password: demo-password"

      - name: Restart keeps data and skips the seed
        run: |
          docker compose restart app
          docker compose up --wait --wait-timeout 120
          docker compose logs app | grep "Database already seeded, skipping."

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down --volumes
